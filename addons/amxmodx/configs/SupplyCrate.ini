#==============================================#
# Supply Crate by RedSMURF: Configuration file #
#==============================================#

# To add a new crate, follow the example below
# [Crate Name]
# CRATE_MODEL          = Path of crate's model
# CRATE_CLASS          = 0 - Ammo Crate,        1 - Grenades Crate,  2 - Market Crate
# CRATE_TEAM           = 0 - Disabled           1 - Terrorist Only,  2 - CT Only,        3 - Both Teams
# CRATE_MODE           = (Armor)                a - Vest,            b - Vesthelm
#                      = (Ammo Crate)           c - Ammo
#                      = (Grenades Crate)       c - HE,              d - FB1,            e - FB2,            f - Smoke
# CRATE_FLAGS          = a - Breaks,            b - Explodes
# CRATE_SOUND_FLAGS    = a - Placed Sound,      b - Using Sound,     c - Empty Sound,    d - Removed Sound,  e - Sell Sound,     f - Supply Sound,   g - Refill Sound
# CRATE_COOLDOWN       = Delay in seconds between each use
# CRATE_CAPACITY       = Maximum amount of supply this crate can give
# CRATE_REFILL         = Delay in seconds for the crate to refill, -1: Disabled
# CRATE_DELAY          = Seconds before the crate get activated
# CRATE_HEALTH         = Crate's health (Default = 250)
# CRATE_ARMOR          = Crate's armor supply (Default = 100)
# CRATE_FACTOR         = Factor for Market selling and for Ammo supplying
# CRATE_FACTOR_MAX     = Maximum factor limit for ammo crates
# CRATE_SPAWN_CHANCE   = Crate's respawn probability (0.0 = never, 1.0 = always)
# CRATE_EXPLODE_DAMAGE = Explosion Damage (Default = 100)
# CRATE_EXPLODE_RADIUS = Explosion Radius (Default = 150)

# To make a crate available in the menu, you must defined at least it's name like this [Ammo Crate]
# crate model and sound cannot be changed dynamically during gameplay

[Main Settings]
SETTING_DEFAULT_MODEL       = models/SupplyCrate/ammo_crate.mdl
SETTING_MINS                = -17.0 -29.0 -17.0
SETTING_MAXS                = 17.0 29.0 17.0

SETTING_CRATE_LOAD          = 1       # Whether to load saved crates data of the current map
SETTING_CRATE_RANGE         = 75.0    # Max distance to interact with a crate
SETTING_OFFSET_BASE         = 120.0   # Default forward offset when previewing crate placement
SETTING_OFFSET_MIN          = 65.0    # Minimum offset from the player to the crate
SETTING_OFFSET_MAX          = 900.0   # Maximum offset from the player to the crate
SETTING_OFFSET_STEP         = 10.0    # Step size when scrolling to move crate forward/backward
SETTING_OFFSET_FREQ         = 0.1     # Scroll responsivness for placement offset (lower = faster)
SETTING_GHOST_FREQ          = 0.1     # Refresh rate of the ghost model (min = 0.1)
SETTING_GHOST_ALPHA         = 90      # Transparency level of the ghost preview model (0 - 255)

SETTING_SOUND_PLACE         = SupplyCrate/button4.wav
SETTING_SOUND_REMOVE        = SupplyCrate/metal6.wav
SETTING_SOUND_EMPTY         = SupplyCrate/latchlocked1.wav
SETTING_SOUND_SUPPLY        = SupplyCrate/9mmclip1.wav
SETTING_SOUND_SELL          = SupplyCrate/Ch-ching.wav
SETTING_SOUND_REFILL        = SupplyCrate/button4.wav
SETTING_SOUND_MENU_NAV      = buttons/blip1.wav
SETTING_SOUND_MENU_REMOVE   = buttons/button10.wav

SETTING_COLOR_ACTIVE    = 0 255 0
SETTING_COLOR_INACTIVE  = 255 0 0

